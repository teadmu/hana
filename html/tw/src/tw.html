<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <title>Document</title>
    <style>
      @keyframes rotate-axis {
        from {
          transform: perspective(800px) rotateY(0deg);
        }
        to {
          transform: perspective(800px) rotateY(360deg);
        }
      }
      .rotate-axis {
        animation: rotate-axis 10s linear infinite;
      }
      .satellites {
        animation: rotate-axis 10s linear infinite;
        transform-style: preserve-3d;
        display: flex;
        justify-content: center;
      }

      .satellite {
        position: absolute;
        width: 100px;
        transform: rotateY(calc(var(--i) * 1deg)) translateZ(100px);
      }
    </style>
  </head>
  <body class="m-0 p-0 w-full h-screen pt-80">
    <div
      class="satellites border-4 border-black rotate-axis flex justify-center"
    >
      <img
        class="satellite"
        style="--i: 0"
        src="https://cdn.simpleicons.org/javascript"
      />
      <img
        class="satellite"
        style="--i: 60"
        src="https://cdn.simpleicons.org/javascript"
      />
      <img
        class="satellite"
        style="--i: 120"
        src="https://cdn.simpleicons.org/javascript"
      />
    </div>
  </body>
</html>
